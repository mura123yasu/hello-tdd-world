spring:
  application:
    name: inventory-backend
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:inventory};encrypt=false
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:Your_strong_Pass123}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
